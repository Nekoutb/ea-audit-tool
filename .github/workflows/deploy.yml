name: Deploy

# Two-stage release pipeline for auditisa.com:
#
#   CI green on `dev`   ──►  deploy to STAGING   https://dev.auditisa.com   (automatic)
#   CI green on `main`  ──►  deploy to PRODUCTION https://www.auditisa.com  (waits for a
#                            reviewer's approval on the `production` environment)
#
# Both jobs SSH to the server and run the deploy script that lives there
# (/usr/local/sbin/deploy-ea-audit, source: deploy/deploy-ea-audit.sh). The
# script builds the exact commit CI tested, migrates, switches atomically,
# health-checks and rolls back on failure. Production carries a second,
# server-side gate: the script refuses any commit that has not already been
# deployed to staging — GitHub approval alone cannot skip the staging step.
#
# Required repository secrets:
#   DEPLOY_HOST         server hostname or IP
#   DEPLOY_USER         SSH user allowed to run deploy-ea-audit (root, or a
#                       user whose authorized_keys forces the command)
#   DEPLOY_SSH_KEY      private key for that user (dedicated key, ed25519)
#   DEPLOY_KNOWN_HOSTS  optional: the server's host key (`ssh-keyscan <host>`);
#                       when absent the first connection pins it automatically
#
# Required environments (Settings → Environments):
#   staging      url https://dev.auditisa.com  — no protection rules
#   production   url https://www.auditisa.com  — add "Required reviewers";
#                that reviewer's approval is the "confirmed working on
#                staging" sign-off that releases to production.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, main]
  # Manual escape hatch: redeploy a ref without a fresh CI run (e.g. after a
  # server-side rollback, or to put a feature branch on staging for a demo).
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy where?"
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: "Branch or commit (default: staging→dev, production→main)"
        required: false
        default: ""

permissions: {} # the GITHUB_TOKEN is unused — everything happens over SSH

jobs:
  staging:
    name: Staging (dev.auditisa.com)
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://dev.auditisa.com
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      # A workflow_run deploy ships the exact sha CI tested, never the branch
      # tip — a push racing the deploy cannot smuggle an untested commit out.
      DEPLOY_REF: >-
        ${{ github.event_name == 'workflow_run'
            && github.event.workflow_run.head_sha
            || (inputs.ref != '' && inputs.ref || 'dev') }}
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }
          test -n "$HOST" || { echo "::error::DEPLOY_HOST secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi

      - name: Deploy to staging
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # ssh joins its arguments into a remote shell command line, so the
          # ref must never carry shell metacharacters (workflow_dispatch lets
          # a human type it).
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref '$DEPLOY_REF' contains characters a git ref cannot have"; exit 1; }
          echo "Deploying $DEPLOY_REF to staging (dev.auditisa.com)"
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$HOST" -- deploy-ea-audit dev "$DEPLOY_REF"

      # The script already health-checked the app port and would have rolled
      # back; this confirms the public chain (DNS, TLS, vhost) too.
      - name: Verify through Apache
        run: curl -fsS -o /dev/null --retry 3 --retry-delay 5 https://dev.auditisa.com/login

  production:
    name: Production (www.auditisa.com)
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `production` environment must be configured with required reviewers:
    # this job then PAUSES here until someone approves it in the Actions UI.
    # Approving is the statement "I have checked this on dev.auditisa.com".
    environment:
      name: production
      url: https://www.auditisa.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_REF: >-
        ${{ github.event_name == 'workflow_run'
            && github.event.workflow_run.head_sha
            || (inputs.ref != '' && inputs.ref || 'main') }}
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is not set"; exit 1; }
          test -n "$HOST" || { echo "::error::DEPLOY_HOST secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi

      - name: Deploy to production
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref '$DEPLOY_REF' contains characters a git ref cannot have"; exit 1; }
          echo "Promoting $DEPLOY_REF to production (www.auditisa.com)"
          # --yes: stdin is not a terminal here, and the human confirmation
          # already happened as the environment approval. The script still
          # refuses any commit that never ran on staging (deployed-shas.log),
          # backs the database up first, and rolls back on a failed health check.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$HOST" -- deploy-ea-audit prod "$DEPLOY_REF" --yes

      - name: Verify through Apache
        run: curl -fsS -o /dev/null --retry 3 --retry-delay 5 https://www.auditisa.com/login
