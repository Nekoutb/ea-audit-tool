name: CI

on:
  push:
    branches:
      - main
      # The Deploy workflow (deploy.yml) listens for this workflow finishing on
      # dev and main — a green CI run on dev is what releases to staging.
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ea_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ea_audit
      # Generated per run by the 'app role' step below; never a literal, so the
      # repository does not publish a password that also works elsewhere.
      APP_DATABASE_URL: postgresql://ea_app:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/ea_audit
      APP_ROLE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      AUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3100
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Set up database (migrate + app role + RLS)
        working-directory: platform
        run: npm run db:setup

      - name: Typecheck
        working-directory: platform
        run: npm run typecheck

      - name: Lint
        working-directory: platform
        run: npm run lint

      - name: Unit tests (incl. tenant-isolation RLS proof)
        working-directory: platform
        run: npm run test

      - name: Install Playwright browser
        working-directory: platform
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (cross-tenant isolation, auth, notifications)
        working-directory: platform
        run: npm run test:e2e
