# Dev/staging vhost for the AuditISA platform. An exact ServerName always beats
# the alphabetical default vhost (000-bp.cm-ea.com.conf), which is where
# dev.auditisa.com used to land. TLS reuses the Let's Encrypt wildcard
# certificate that already covers *.auditisa.com.
<VirtualHost *:80>
    ServerName dev.auditisa.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/auditisa-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/auditisa-dev-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev.auditisa.com

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/auditisa.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auditisa.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # A staging site must never end up in a search index.
    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyPass / http://127.0.0.1:3201/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3201/

    ErrorLog ${APACHE_LOG_DIR}/auditisa-dev-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/auditisa-dev-ssl-access.log combined
</VirtualHost>
</IfModule>
