<title>Engagement Console — design proposal</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#fff; --surface-2:#fafafa; --grouped:#f2f2f7;
  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#8e8e93;
  --sep:rgba(60,60,67,.14); --sep-soft:rgba(60,60,67,.07);
  --accent:#0a7a5c; --accent-fill:rgba(10,122,92,.10);
  --red:#c9241d; --red-fill:rgba(201,36,29,.10);
  --orange:#a8560a; --orange-fill:rgba(168,86,10,.11);
  --blue:#31538f; --blue-fill:rgba(49,83,143,.10);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rl:18px; --rm:13px; --rs:9px;
  --e1:0 .5px 1px rgba(0,0,0,.05); --e2:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000; --surface:#1c1c1e; --surface-2:#161618; --grouped:#0d0d0f;
  --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8a8a8e;
  --sep:rgba(84,84,88,.5); --sep-soft:rgba(84,84,88,.28);
  --accent:#30d158; --accent-fill:rgba(48,209,88,.14);
  --red:#ff453a; --red-fill:rgba(255,69,58,.14);
  --orange:#ff9f0a; --orange-fill:rgba(255,159,10,.14);
  --blue:#7d9bec; --blue-fill:rgba(125,155,236,.14);
  --e1:0 .5px 1px rgba(0,0,0,.5); --e2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{--bg:#000;--surface:#1c1c1e;--surface-2:#161618;--grouped:#0d0d0f;--label:#f5f5f7;--label-2:#a1a1a6;--label-3:#8a8a8e;
 --sep:rgba(84,84,88,.5);--sep-soft:rgba(84,84,88,.28);--accent:#30d158;--accent-fill:rgba(48,209,88,.14);--red:#ff453a;--red-fill:rgba(255,69,58,.14);
 --orange:#ff9f0a;--orange-fill:rgba(255,159,10,.14);--blue:#7d9bec;--blue-fill:rgba(125,155,236,.14);
 --e1:0 .5px 1px rgba(0,0,0,.5);--e2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);}
:root[data-theme="light"]{--bg:#f5f5f7;--surface:#fff;--surface-2:#fafafa;--grouped:#f2f2f7;--label:#1d1d1f;--label-2:#6e6e73;--label-3:#8e8e93;
 --sep:rgba(60,60,67,.14);--sep-soft:rgba(60,60,67,.07);--accent:#0a7a5c;--accent-fill:rgba(10,122,92,.10);--red:#c9241d;--red-fill:rgba(201,36,29,.10);
 --orange:#a8560a;--orange-fill:rgba(168,86,10,.11);--blue:#31538f;--blue-fill:rgba(49,83,143,.10);
 --e1:0 .5px 1px rgba(0,0,0,.05);--e2:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:15px/1.47 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.021em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
.tnum{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);letter-spacing:0}
select,input[type=text],textarea{font:14px var(--sans);color:var(--label);background:var(--surface);border:1px solid var(--sep);border-radius:8px;padding:6px 9px;max-width:100%}
select:focus,input:focus,textarea:focus{outline:3px solid var(--accent-fill);outline-offset:0;border-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
input[type=range]{accent-color:var(--accent);flex:1;min-width:160px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hin{max-width:1180px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.02em}
.mark i{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 11px var(--sans);font-style:normal}
.eng{font-size:12.5px;color:var(--label-2)}
.eng b{color:var(--label);font-weight:500}
.hact{margin-left:auto;display:flex;gap:6px;align-items:center}
.gbtn{background:transparent;border:0;color:var(--label-2);font-size:14px;padding:6px 12px;border-radius:8px}
.gbtn:hover{color:var(--label);background:var(--sep-soft)}
.gbtn[aria-current="true"]{color:var(--label);font-weight:500}
.icn{width:30px;height:30px;border-radius:50%;border:0;background:var(--sep-soft);color:var(--label-2);display:grid;place-items:center;font-size:13px}
.icn:hover{color:var(--label)}
/* segmented control */
.seg{max-width:1180px;margin:0 auto;padding:0 22px 11px;display:flex}
.segin{display:inline-flex;background:var(--grouped);border-radius:10px;padding:2px;gap:2px;overflow-x:auto;max-width:100%}
.segin button{border:0;background:transparent;color:var(--label-2);font-size:13.5px;font-weight:500;padding:6px 15px;border-radius:8px;white-space:nowrap}
.segin button[aria-current="true"]{background:var(--surface);color:var(--label);box-shadow:var(--e1)}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}
.view{display:none}.view.on{display:block}
.hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:32px;letter-spacing:-.028em;line-height:1.1}
.sub{color:var(--label-2);font-size:15px}
.eyebrow{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--label-3);margin:26px 0 9px}
.card{background:var(--surface);border-radius:var(--rl);box-shadow:var(--e1);overflow:hidden}
.pad{padding:19px 21px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.split{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:940px){.grid2,.grid3,.split{grid-template-columns:1fr}}

/* inset grouped list */
.list{background:var(--surface);border-radius:var(--rl);box-shadow:var(--e1);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;border:0;padding:13px 19px;position:relative}
.row+.row:before{content:"";position:absolute;left:19px;right:0;top:0;height:.5px;background:var(--sep-soft)}
.row:hover{background:var(--sep-soft)}
.row .t{font-size:15px;min-width:0;flex:1}
.row .t small{display:block;color:var(--label-2);font-size:12.5px;margin-top:1px}
.row .v{color:var(--label-2);font-size:14px;white-space:nowrap}
.row .chev{color:var(--label-3);font-size:16px;margin-left:2px}
.row .idx{width:24px;height:24px;border-radius:50%;background:var(--grouped);color:var(--label-2);display:grid;place-items:center;font:600 11.5px var(--mono);flex:0 0 auto}
.row.done .idx{background:var(--accent);color:#fff}

/* rings */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.rings{grid-template-columns:repeat(2,1fr)}}
.rc{background:var(--surface);border-radius:var(--rl);box-shadow:var(--e1);padding:20px 16px;text-align:center;border:0}
.rc:hover{box-shadow:var(--e2)}
.rc[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.ring{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--grouped) 0)}
.ring i{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 19px var(--sans);font-style:normal;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rc .n{font-size:14px;font-weight:500}
.rc .m{font-size:12.5px;color:var(--label-2);margin-top:2px}

/* stat cards */
.stat{background:var(--surface);border-radius:var(--rl);box-shadow:var(--e1);padding:18px 20px}
.stat .k{font-size:13px;color:var(--label-2)}
.stat .n{font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.stat .f{font-size:12.5px;color:var(--label-2);margin-top:2px}
.stat .f b{color:var(--orange);font-weight:600}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border-radius:99px;padding:3px 10px;background:var(--grouped);color:var(--label-2);white-space:nowrap}
.pill.ok{background:var(--accent-fill);color:var(--accent)}
.pill.warn{background:var(--orange-fill);color:var(--orange)}
.pill.bad{background:var(--red-fill);color:var(--red)}
.pill.info{background:var(--blue-fill);color:var(--blue)}
.pill.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:0}
.btn{border:0;background:var(--grouped);color:var(--label);border-radius:9px;padding:7px 15px;font-size:14px;font-weight:500}
.btn:hover{background:var(--sep)}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 12px;font-size:13px}
.back{display:inline-flex;align-items:center;gap:5px;background:transparent;border:0;color:var(--accent);font-size:14.5px;padding:0;margin-bottom:14px}

/* tick */
.tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:0 0 auto;
  border:1.5px solid var(--sep);color:transparent}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tick.blk{background:var(--red);border-color:var(--red);color:#fff}

/* tables */
.tw{overflow-x:auto;border-radius:var(--rm);background:var(--surface);box-shadow:var(--e1)}
table.g{width:100%;border-collapse:collapse;font-size:13.5px}
table.g th{text-align:left;font:600 11.5px var(--sans);color:var(--label-2);padding:10px 14px;border-bottom:.5px solid var(--sep);white-space:nowrap;letter-spacing:0}
table.g td{padding:9px 14px;border-bottom:.5px solid var(--sep-soft);vertical-align:middle}
table.g tr:last-child td{border-bottom:0}
table.g tr.sig td{background:var(--accent-fill)}
table.g tr.unmapped td{background:var(--red-fill)}
.cra td.c{text-align:center;font:600 12px var(--mono)}
.cra td.h{background:var(--red-fill);color:var(--red)}
.cra td.m{background:var(--orange-fill);color:var(--orange)}
.cra td.l{background:var(--accent-fill);color:var(--accent)}
.cra td.n{color:var(--label-3)}

/* kpi strip */
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 16px}
.kpi b{display:block;font:600 24px var(--sans);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--label-2)}

/* working paper */
.paper{background:var(--surface);border-radius:var(--rl);box-shadow:var(--e1);padding:30px 34px;max-width:780px}
@media(max-width:700px){.paper{padding:22px 20px}}
.paper h2{font-size:24px;letter-spacing:-.025em}
.pcode{font:600 11.5px var(--mono);color:var(--label-3);letter-spacing:.04em}
.pstd{color:var(--label-2);font-size:13.5px;margin:6px 0 22px}
.psec{font:600 12px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--label-3);margin:26px 0 10px}
.frow{padding:12px 0;border-top:.5px solid var(--sep-soft)}
.flab{font-size:13px;color:var(--label-2);margin-bottom:5px}
.fauto{background:var(--blue-fill);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--label)}
.fin{width:100%;min-height:56px;background:var(--orange-fill);border:0;border-radius:9px;padding:9px 12px;font:14px var(--sans);color:var(--label);resize:vertical}
.fin::placeholder{color:var(--label-3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--label-2);margin-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}

/* feed */
.fitem{display:flex;gap:11px;padding:12px 19px;position:relative;font-size:13.5px;color:var(--label-2)}
.fitem+.fitem:before{content:"";position:absolute;left:19px;right:0;top:0;height:.5px;background:var(--sep-soft)}
.fitem b{color:var(--label);font-weight:500}
.fdot{width:7px;height:7px;border-radius:50%;background:var(--label-3);margin-top:6px;flex:0 0 auto}
.fdot.a{background:var(--red)}.fdot.b{background:var(--orange)}

.note{color:var(--label-2);font-size:14px;max-width:70ch;margin:0}
.hint{color:var(--label-3);font-size:13px}
.drop{border:1.5px dashed var(--sep);border-radius:var(--rm);padding:18px;text-align:center;font-size:13.5px;color:var(--label-2)}
.drop b{color:var(--accent);cursor:pointer}
.empty{text-align:center;padding:38px 20px;color:var(--label-3);font-size:14px}
footer{max-width:1180px;margin:0 auto;padding:0 22px 40px;color:var(--label-3);font-size:12.5px}
</style>

<header>
  <div class="hin">
    <div class="mark"><i>EA</i>AuditISA</div>
    <div class="eng"><b>ZOEDEN SA</b> · FY 2026 · SYSCOHADA</div>
    <div class="hact">
      <button class="gbtn" data-go="tools">Tools</button>
      <button class="gbtn" data-go="docs">Documents</button>
      <button class="gbtn" data-go="team">Team</button>

  <div class="seg"><div class="segin" id="segbar"></div></div>
</header>

<main>

  <section class="view" id="v-tool"></section>

  <section class="view" id="v-team"></section>
</main>

function craLevel(acct,as){
  var w=WCGW.filter(function(x){return x.a===acct&&x.as===as;});
  if(!w.length)return (ASSERT[acct]||[]).indexOf(as)>-1?['l','L']:['n','—'];
  var rel=w.some(function(x){return x.strat==='reliance'&&x.ctrl;});
  return rel?['m','M']:['h','H'];
}

function fin(l){return '<div class="frow"><div class="flab">'+l+'</div><textarea class="fin" placeholder="Record the work performed"></textarea></div>';}
function el(id){return document.getElementById(id);}
function log(){}
function phStats(i){var l=SEQ[i],d=l.filter(function(c){return DONE[c]===1;}).length;
  return {n:l.length,done:d,pct:Math.round(d/l.length*100)};}
function statusPill(c){var d=DONE[c]||0;
  return d===1?'<span class="pill ok">Signed off</span>':d===2?'<span class="pill info">In progress</span>':
    d===3?'<span class="pill warn">For review</span>':'<span class="pill">Not started</span>';}

/* ================= overview ================= */
function drawOverview(){
  var openF=0;Object.keys(FINDINGS).forEach(function(c){FINDINGS[c].forEach(function(x){if(x[0]==='Open')openF++;});});
  var forRev=Object.keys(DONE).filter(function(c){return DONE[c]===3;}).length;
  var todo=noCover().length+unmapped().length+unanswered().length;
  var ex=INDEP.rows.filter(function(r){return r.ex;}).length;
  var out=INDEP.rows.filter(function(r){return r.s!=='responded';}).length;
  var m=MILE[curPh];
  el('v-overview').innerHTML=
   '<div class="hero"><h1>ZOEDEN SA</h1><span class="sub">Annual audit 2026</span></div>'+
   '<div class="rings">'+PHASE.map(function(p,i){var s=phStats(i);
     return '<button class="rc" data-ph="'+i+'"><div class="ring" style="--p:'+s.pct+'"><i>'+s.pct+'%</i></div>'+
       '<div class="n">'+p+'</div><div class="m">'+s.done+' of '+s.n+'</div></button>';}).join('')+'</div>'+
   '<div class="eyebrow">Attention</div>'+
   '<div class="grid3">'+
     stat('Open findings',openF,openF?'needs clearing':'none')+
     stat('For review',forRev,forRev?'awaiting a reviewer':'nothing waiting')+
     stat('Blocking items',todo,todo?'<b>gate G2 held</b>':'gates clear')+
   '</div>'+
   '<div class="split" style="margin-top:14px">'+
     '<div><div class="eyebrow">'+PHASE[curPh]+' · milestones</div>'+
       '<div class="list">'+m.map(function(x,j){var on=mileDone(x),bl=!on&&mileBlocked(x);
         return '<button class="row'+(on?' done':'')+'" data-task="'+x[1]+'"><span class="idx">'+(j+1)+'</span>'+
           '<span class="t">'+x[0]+'</span><span class="v mono">'+x[1]+'</span>'+
           '<span class="tick '+(on?'on':bl?'blk':'')+'">'+(on?'✓':bl?'!':'')+'</span></button>';}).join('')+'</div>'+
       '<div class="eyebrow">Independence</div>'+
       '<div class="list"><button class="row" data-tool="indep"><span class="t">Team responses'+
         '<small>'+(INDEP.rows.length-out)+' of '+INDEP.rows.length+' returned'+(ex?' · '+ex+' exception'+(ex>1?'s':''):'')+'</small></span>'+
         '<span class="v">'+(out?out+' outstanding':'complete')+'</span><span class="chev">›</span></button></div>'+
     '</div>'+
     '<div><div class="eyebrow">Activity</div><div class="card">'+
       FEED.map(function(f){return '<div class="fitem"><span class="fdot '+f[1]+'"></span><span>'+f[0]+'</span></div>';}).join('')+
     '</div></div>'+
   '</div>';
}
function stat(k,n,f){return '<div class="stat"><div class="k">'+k+'</div><div class="n tnum">'+n+'</div><div class="f">'+f+'</div></div>';}

/* ================= phase ================= */
function drawPhase(i){
  var s=phStats(i),d=DOCS[i];
  el('v-phase').innerHTML=
   '<div class="hero"><h1>'+PHASE[i]+'</h1><span class="sub">'+s.done+' of '+s.n+' signed off · gate '+PHGATE[i]+'</span></div>'+
   '<div class="list">'+SEQ[i].map(function(c,j){var f=F[c],fn=(FINDINGS[c]||[]).filter(function(x){return x[0]==='Open';}).length;
     return '<button class="row'+(DONE[c]===1?' done':'')+'" data-task="'+c+'"><span class="idx">'+(j+1)+'</span>'+
       '<span class="t">'+f.t+'<small>'+c+'</small></span>'+
       (fn?'<span class="pill bad">'+fn+'</span>':'')+statusPill(c)+'<span class="chev">›</span></button>';}).join('')+'</div>'+
   '<div class="eyebrow">Linked phases</div>'+lnk(i)+
   '<div class="eyebrow">Documents</div>'+
   '<div class="list">'+d.map(function(x,k){
     return '<div class="row"><span class="t">'+x[0]+'</span><span class="v mono">'+x[1]+'</span>'+
       '<button class="btn sm" data-rmdoc="'+i+'|'+k+'">Remove</button></div>';}).join('')+'</div>'+
   '<div class="drop" style="margin-top:10px">Drop files, or <b data-adddoc="'+i+'">choose a file</b></div>';
}
function lnk(i){
  var inn={},out={};
  SEQ[i].forEach(function(c){
    (F[c].fedBy||[]).forEach(function(x){var p=PH_OF[x];if(p!==undefined&&p!==i)(inn[p]=inn[p]||[]).push(x);});
    (F[c].feeds||[]).forEach(function(x){var p=PH_OF[x];if(p!==undefined&&p!==i)(out[p]=out[p]||[]).push(x);});});
  function rows(mp,dir){var ks=Object.keys(mp);
    if(!ks.length)return '<div class="row"><span class="t" style="color:var(--label-3)">None</span></div>';
    return ks.map(function(k){return '<button class="row" data-ph="'+k+'"><span class="t">'+(dir==='in'?'From ':'To ')+PHASE[k]+
      '<small>'+[...new Set(mp[k])].join(' · ')+'</small></span><span class="chev">›</span></button>';}).join('');}
  return '<div class="grid2"><div class="list">'+rows(inn,'in')+'</div><div class="list">'+rows(out,'out')+'</div></div>';
}

/* ================= task, its own page ================= */
function drawTask(c){
  var f=F[c],i=PH_OF[c],d=DONE[c]||0,ev=EVID[c]||[],fs=FINDINGS[c]||[],ns=NOTES[c]||[];
  var toolsFeeding=TOOLS.filter(function(t){return t.feeds.indexOf(c)>-1;});
  el('v-task').innerHTML=
   '<button class="back" data-ph="'+i+'">‹ '+PHASE[i]+'</button>'+
   '<div class="hero"><h1>'+f.t+'</h1></div>'+
   '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-10px 0 20px">'+
     '<span class="pill mono">'+c+'</span>'+statusPill(c)+'<span class="pill">Adèle Nkoulou</span>'+
     '<span class="pill mono">Gate '+f.gate+'</span>'+
     '<span style="margin-left:auto;display:flex;gap:7px">'+
       '<button class="btn sm" data-handoff="'+c+'">Hand off</button>'+
       '<button class="btn sm pri" data-sign="'+c+'">'+(d===1?'Withdraw':'Sign off')+'</button></span>'+
   '</div>'+
   '<div class="seg" style="max-width:none;margin:0 0 18px;padding:0"><div class="segin">'+
     [['paper','Paper'],['evidence','Evidence'+(ev.length?' '+ev.length:'')],['findings','Findings'+(fs.length?' '+fs.length:'')],['activity','Activity'+(ns.length?' '+ns.length:'')]]
      .map(function(t){return '<button data-tab="'+t[0]+'" aria-current="'+(tab===t[0])+'">'+t[1]+'</button>';}).join('')+
   '</div></div>'+
   (tab==='paper'?
     '<div class="legend"><span><i style="background:var(--blue-fill)"></i>From a tool</span>'+
       '<span><i style="background:var(--orange-fill)"></i>Your judgement</span></div>'+
     '<div class="paper"><div class="pcode">'+c+'</div><h2>'+f.t+'</h2>'+
       '<div class="pstd">'+f.std+'</div>'+
       '<div class="psec">Record owned</div><div style="font-size:14px">'+f.owns+'</div>'+
       '<div class="psec">The paper</div>'+formBody(c)+'</div>'+
     (toolsFeeding.length?'<div class="eyebrow">Values above come from</div><div class="list">'+
       toolsFeeding.map(function(t){return '<button class="row" data-tool="'+t.id+'"><span class="t">'+t.n+'<small>'+t.d+'</small></span><span class="chev">›</span></button>';}).join('')+'</div>':'')
   :tab==='evidence'?
     (ev.length?'<div class="tw"><table class="g"><tr><th>Ref</th><th>Item</th><th>Type</th><th>Added</th></tr>'+
       ev.map(function(e){return '<tr><td class="mono">'+e[0]+'</td><td>'+e[1]+'</td><td>'+e[2]+'</td><td style="color:var(--label-2)">'+e[3]+'</td></tr>';}).join('')+'</table></div>'
      :'<div class="card empty">No evidence attached</div>')+
     '<div class="drop" style="margin-top:12px">Drop files, or <b data-addev="'+c+'">choose a file</b></div>'
   :tab==='findings'?
     (fs.length?'<div class="tw"><table class="g"><tr><th>Status</th><th>Finding</th><th>Raised by</th><th>Date</th></tr>'+
       fs.map(function(x){return '<tr><td>'+(x[0]==='Open'?'<span class="pill bad">Open</span>':'<span class="pill ok">Cleared</span>')+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td><td style="color:var(--label-2)">'+x[3]+'</td></tr>';}).join('')+'</table></div>'
      :'<div class="card empty">No findings</div>')+
     '<div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="fi" placeholder="Describe the finding" style="flex:1">'+
     '<button class="btn pri" data-addfind="'+c+'">Raise</button></div>'
   :
     (ns.length?'<div class="list">'+ns.map(function(n){
       return '<div class="row"><span class="t">'+n[3]+'<small>'+n[0]+' · '+n[1]+' · '+n[2]+'</small></span>'+(n[4]?'<span class="pill warn">Open</span>':'')+'</div>';}).join('')+'</div>'
      :'<div class="card empty">No review notes</div>')+
     '<div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="rn" placeholder="Add a review note" style="flex:1">'+
     '<button class="btn" data-addnote="'+c+'">Add</button></div>');
}

/* ================= tools ================= */
function drawTools(){
  el('v-tools').innerHTML=
   '<div class="hero"><h1>Tools</h1><span class="sub">Results flow into the working papers listed</span></div>'+
   '<div class="list">'+TOOLS.map(function(t){
     return '<button class="row" data-tool="'+t.id+'"><span class="t">'+t.n+'<small>'+t.d+'</small></span>'+
       '<span class="v">'+t.feeds.join(' · ')+'</span><span class="chev">›</span></button>';}).join('')+'</div>';
}
function drawTool(id){
  var t=toolById(id);if(!t)return;
  el('v-tool').innerHTML=
   '<button class="back" data-go="tools">‹ Tools</button>'+
   '<div class="hero"><h1>'+t.n+'</h1><span class="sub">'+t.d+'</span></div>'+
   '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:-10px 0 20px">'+
     '<span class="pill">Feeds</span>'+t.feeds.map(function(c){
       return '<button class="pill info" data-task="'+c+'">'+c+' · '+F[c].t+'</button>';}).join('')+'</div>'+
   '<div id="toolbody"></div>';
  var h=el('toolbody');
  if(id==='mat')h.innerHTML='<div class="card pad"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
    '<input type="range" id="omRange" min="4000000" max="42000000" step="500000" value="'+ENG.om+'">'+
    '<span class="tnum" style="font-size:22px;font-weight:600" id="omOut">'+FMT(ENG.om)+'</span></div>'+
    '<div class="kpis" id="kmat" style="margin-top:16px"></div></div>';
  if(id==='tb')h.innerHTML='<div class="kpis" id="k1"></div><div class="tw"><table class="g" id="tbTable"></table></div>';
  if(id==='sig')h.innerHTML='<div class="kpis" id="k2"></div><div class="tw"><table class="g" id="sigTable"></table></div>';
  if(id==='wcgw')h.innerHTML='<div class="kpis" id="k3"></div><div id="wcgwHost"></div>';
  if(id==='strat')h.innerHTML='<div class="kpis" id="k4"></div><div class="tw"><table class="g" id="stratTable"></table></div>'+
    '<div class="eyebrow">Combined risk</div><div class="kpis" id="kcra"></div><div class="tw"><table class="g cra" id="craTable"></table></div>';
  if(id==='indep')h.innerHTML=indepBody();
  redrawTools();
}
function indepBody(){
  var r=INDEP.rows,resp=r.filter(function(x){return x.s==='responded';}).length,ex=r.filter(function(x){return x.ex;}).length;
  return '<div class="kpis">'+
     '<div class="kpi"><b>'+r.length+'</b><span>team members</span></div>'+
     '<div class="kpi"><b>'+resp+'</b><span>responded</span></div>'+
     '<div class="kpi"><b>'+(r.length-resp)+'</b><span>outstanding</span></div>'+
     '<div class="kpi"><b>'+ex+'</b><span>exceptions</span></div></div>'+
   '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+
     '<button class="btn pri" data-iq="send">Send to outstanding</button>'+
     '<button class="btn" data-iq="remind">Remind</button></div>'+
   '<div class="tw"><table class="g"><tr><th>Member</th><th>Role</th><th>Status</th><th>Returned</th><th>Exception</th><th></th></tr>'+
     r.map(function(x,k){
       return '<tr><td>'+x.n+'</td><td style="color:var(--label-2)">'+x.r+'</td>'+
        '<td>'+(x.s==='responded'?'<span class="pill ok">Responded</span>':x.s==='sent'?'<span class="pill warn">Sent</span>':'<span class="pill">Not sent</span>')+'</td>'+
        '<td class="tnum" style="color:var(--label-2)">'+(x.d||'—')+'</td>'+
        '<td>'+(x.ex?'<span class="pill bad">'+x.ex+'</span>':'<span style="color:var(--label-3)">None</span>')+'</td>'+
        '<td>'+(x.s==='responded'?'':'<button class="btn sm" data-iqrec="'+k+'">Record</button>')+'</td></tr>';}).join('')+
   '</table></div>'+
   '<div class="eyebrow">Declaration</div><div class="list">'+
     IQ.map(function(q){return '<div class="row"><span class="t">'+q+'</span><span class="v">Nil declared</span></div>';}).join('')+'</div>';
}
function redrawTools(){
  if(el('tbTable'))drawTb();
  if(el('sigTable'))drawSig();
  if(el('wcgwHost'))drawWcgw();
  if(el('stratTable'))drawStrat();
  if(el('craTable'))drawCra();
  if(el('kmat'))el('kmat').innerHTML=kpi(FMT(ENG.om),'overall')+kpi(FMT(PM()),'performance')+
    kpi(FMT(Math.round(ENG.om*ENG.ctPct)),'clearly trivial')+kpi(sigAccts().length,'accounts in scope');
  if(el('omOut'))el('omOut').textContent=FMT(ENG.om);
}

/* ================= documents, team ================= */
function drawDocs(){
  el('v-docs').innerHTML='<div class="hero"><h1>Documents</h1></div>'+
   PHASE.map(function(p,i){return '<div class="eyebrow">'+p+'</div><div class="list">'+
     DOCS[i].map(function(x,k){return '<div class="row"><span class="t">'+x[0]+'</span><span class="v mono">'+x[1]+'</span>'+
       '<button class="btn sm" data-rmdoc="'+i+'|'+k+'">Remove</button></div>';}).join('')+'</div>'+
     '<div class="drop" style="margin-top:9px">Drop files, or <b data-adddoc="'+i+'">choose a file</b></div>';}).join('');
}
function drawTeam(){
  el('v-team').innerHTML='<div class="hero"><h1>Team</h1></div><div class="list">'+
   TEAM.map(function(t){return '<div class="row"><span class="t">'+t[0]+'<small>'+t[2]+'</small></span>'+
     '<span class="pill">'+t[1]+'</span><span class="v">'+t[3]+'</span></div>';}).join('')+'</div>';
}

/* ================= navigation ================= */
function drawSeg(){
  el('segbar').innerHTML='<button data-go="overview" aria-current="'+(view==='overview')+'">Overview</button>'+
   PHASE.map(function(p,i){return '<button data-ph="'+i+'" aria-current="'+((view==='phase'||view==='task')&&curPh===i)+'">'+p+'</button>';}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.gbtn'),function(b){
    b.setAttribute('aria-current',b.dataset.go===view);});
}
function go(v){view=v;
  Array.prototype.forEach.call(document.querySelectorAll('.view'),function(s){s.classList.toggle('on',s.id==='v-'+v);});
  drawSeg();window.scrollTo({top:0,behavior:'smooth'});}
function openPhase(i){curPh=i;drawPhase(i);drawOverview();go('phase');}
function openTask(c){curTask=c;curPh=PH_OF[c];tab='paper';drawTask(c);go('task');}
function openTool(id){curTool=id;drawTool(id);go('tool');}
function refresh(){
  drawOverview();drawSeg();
  if(view==='phase')drawPhase(curPh);
  if(view==='task'&&curTask)drawTask(curTask);
  if(view==='tools')drawTools();
  if(view==='tool'&&curTool)drawTool(curTool);
  if(view==='docs')drawDocs();
  redrawTools();
}

document.addEventListener('click',function(e){
  var t=e.target,x;
  if((x=t.closest('[data-go]'))){var v=x.dataset.go;if(v==='tools')drawTools();if(v==='docs')drawDocs();if(v==='team')drawTeam();go(v);return;}
  if((x=t.closest('[data-ph]'))){openPhase(+x.dataset.ph);return;}
  if((x=t.closest('[data-task]'))){openTask(x.dataset.task);return;}
  if((x=t.closest('[data-tool]'))){openTool(x.dataset.tool);return;}
  if((x=t.closest('[data-tab]'))){tab=x.dataset.tab;drawTask(curTask);return;}
  if((x=t.closest('[data-sign]'))){var c=x.dataset.sign;DONE[c]=DONE[c]===1?2:1;refresh();return;}
  if((x=t.closest('[data-handoff]'))){var c2=x.dataset.handoff;DONE[c2]=3;
    (NOTES[c2]=NOTES[c2]||[]).unshift(['Adèle Nkoulou','Senior','today','Handed off for review.',0]);refresh();return;}
  if((x=t.closest('[data-addfind]'))){var c3=x.dataset.addfind,v3=el('fi').value.trim();if(!v3)return;
    (FINDINGS[c3]=FINDINGS[c3]||[]).unshift(['Open',v3,'Adèle Nkoulou','today']);drawTask(c3);drawOverview();return;}
  if((x=t.closest('[data-addnote]'))){var c4=x.dataset.addnote,v4=el('rn').value.trim();if(!v4)return;
    (NOTES[c4]=NOTES[c4]||[]).unshift(['Jean-Paul Biya','Manager','today',v4,1]);drawTask(c4);return;}
  if((x=t.closest('[data-addev]'))){var c5=x.dataset.addev;
    (EVID[c5]=EVID[c5]||[]).push(['A-'+((EVID[c5]||[]).length+1),'Attached file','PDF','today']);drawTask(c5);return;}
  if((x=t.closest('[data-adddoc]'))){DOCS[+x.dataset.adddoc].push(['Attached file','PDF']);refresh();return;}
  if((x=t.closest('[data-rmdoc]'))){var pr=x.dataset.rmdoc.split('|');DOCS[+pr[0]].splice(+pr[1],1);refresh();return;}
  if((x=t.closest('[data-iq]'))){
    if(x.dataset.iq==='send')INDEP.rows.forEach(function(r){if(r.s==='notsent')r.s='sent';});
    INDEP.sent=true;el('toolbody').innerHTML=indepBody();drawOverview();return;}
  if((x=t.closest('[data-iqrec]'))){var r=INDEP.rows[+x.dataset.iqrec];r.s='responded';r.d='today';
    el('toolbody').innerHTML=indepBody();drawOverview();return;}
  if((x=t.closest('[data-addw]'))){var id=Math.max.apply(null,WCGW.map(function(w){return w.id;}).concat([0]))+1;
    WCGW.push({id:id,a:x.dataset.addw,as:'C',t:'',ctrl:'',strat:'substantive'});refresh();return;}
  if((x=t.closest('[data-delw]'))){WCGW=WCGW.filter(function(w){return w.id!==+x.dataset.delw;});refresh();return;}
  if(t.id==='themeBtn'){var d=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',d?'light':'dark');return;}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset.map!==undefined){TB[+t.dataset.map].l=t.value;refresh();return;}
  if(t.dataset.qual!==undefined){QUAL[t.dataset.qual]=t.checked;refresh();return;}
  if(t.dataset.was!==undefined){WCGW.filter(function(w){return w.id===+t.dataset.was;})[0].as=t.value;refresh();return;}
  if(t.dataset.strat!==undefined){WCGW.filter(function(w){return w.id===+t.dataset.strat;})[0].strat=t.value;refresh();return;}
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='omRange'){ENG.om=+t.value;redrawTools();drawOverview();return;}
  if(t.dataset.wt!==undefined){WCGW.filter(function(w){return w.id===+t.dataset.wt;})[0].t=t.value;return;}
  if(t.dataset.wc!==undefined){WCGW.filter(function(w){return w.id===+t.dataset.wc;})[0].ctrl=t.value;
    if(el('stratTable'))drawStrat();if(el('craTable'))drawCra();drawOverview();return;}
});

drawOverview();drawPhase(1);drawTools();drawDocs();drawTeam();go('overview');

</script>
